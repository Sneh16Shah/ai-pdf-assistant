<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AskMyPDF</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <!-- Header -->
    <div class="header">
      <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
      <h1>AskMyPDF</h1>
    </div>

    <!-- Loading State -->
    <div id="loading" class="state">
      <div class="spinner"></div>
      <p>Connecting...</p>
    </div>

    <!-- Login Form -->
    <div id="login-state" class="state hidden">
      <p class="subtitle">Sign in to chat with PDFs in your browser</p>
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <div id="login-error" class="error hidden"></div>
        <button type="submit" id="login-btn" class="btn primary">Sign In</button>
      </form>
      <div class="divider"></div>
      <button id="settings-toggle" class="btn ghost">⚙ Settings</button>
      <div id="settings-panel" class="settings hidden">
        <div class="field">
          <label for="api-url">API URL</label>
          <input type="url" id="api-url" placeholder="http://localhost:8081/api/v1">
        </div>
        <button id="save-url" class="btn small">Save</button>
      </div>
    </div>

    <!-- Logged-in State -->
    <div id="auth-state" class="state hidden">
      <div class="user-card">
        <div class="avatar" id="user-avatar">U</div>
        <div class="user-info">
          <span class="user-name" id="user-name">User</span>
          <span class="user-email" id="user-email">user@example.com</span>
        </div>
        <div class="status-badge connected">Connected</div>
      </div>
      <p class="hint">Open any PDF in your browser — a floating <strong>Ask AI</strong> button will appear.</p>
      <button id="logout-btn" class="btn outline">Sign Out</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
